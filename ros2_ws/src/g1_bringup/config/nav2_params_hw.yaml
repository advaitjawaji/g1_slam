# Nav2 parameters — REAL HARDWARE (obstacle-aware).
# Differences vs nav2_params_sim.yaml:
#   - costmaps consume the RealSense depth cloud (/camera/depth/points) as obstacles
#   - global costmap uses the live SLAM map (static_layer) + unknown space tracked
#   - RPP collision detection ON
#   - normal progress checker / goal heading tolerance
# Humans are avoided two ways on hardware:
#   1. They appear in the depth cloud -> costmap obstacle -> Nav2 reroutes
#   2. robot_node subscribes /g1/human_cmd -> hard STOP override (Human_dtp safety logic)
# G1 footprint: ~0.45m x 0.35m, max walking speed ~0.8 m/s

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: pelvis
    odom_topic: /odom        # ZED VIO odom (remapped from /zed/zed_node/odom in hardware.launch.py)
    bt_loop_duration: 10
    default_server_timeout: 20
    # BT XML paths intentionally omitted: hardcoding /opt/ros/humble/... segfaulted
    # bt_navigator on Jazzy (file absent). Leaving these unset makes Nav2 load its
    # own distro-correct default nav_to_pose / nav_through_poses trees.
    #
    # plugin_lib_names intentionally omitted on Jazzy: bt_navigator auto-loads the
    # standard BT nodes by default, so re-listing them here (the Humble way)
    # double-registers and crashes with "ID [ComputePathToPose] already registered".

bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.50    # end roughly facing the goal; loose enough to avoid loops

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.8
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.2
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.6
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true    # HARDWARE: stop before hitting detected obstacles
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.6
      use_cost_regulated_linear_velocity_scaling: true   # slow near obstacles
      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: pelvis
      use_sim_time: false
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.30
      # ZED VIO odom->camera TF arrives with jittery latency (up to ~170ms), so
      # the default 0.3s tolerance made the message filter drop every depth cloud
      # ("timestamp earlier than transform cache") -> stale costmap -> controller
      # output 0. A generous tolerance absorbs the VIO jitter.
      transform_tolerance: 1.0
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        # DISABLED: the chest-mounted ZED is pitched ~17.6 deg down, so it sees the
        # floor and marks it as an obstacle wall right in front -> RPP "detected
        # collision ahead" -> robot never moves. Human avoidance is handled by the
        # /g1/human_cmd velocity override (detection), not this costmap, so the demo
        # navigates fine without depth obstacles. Re-enable + fix height filtering
        # (min_obstacle_height vs the pitched-camera floor) if wall avoidance is wanted.
        enabled: false
        observation_sources: depth
        depth:
          topic: /zed/zed_node/point_cloud/cloud_registered
          sensor_frame: zed_left_camera_frame
          data_type: "PointCloud2"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          clearing: true
          marking: true
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
        # ── Predictive human obstacles — DISABLED pending coordinate check ──
        # human_obstacle_node republishes /humans/markers as a PointCloud2.
        # To enable: set `observation_sources: depth humans` above and uncomment.
        # ⚠️ First confirm detection_node places humans correctly in the map
        # frame (Y-up vs Z-up — see human_obstacle_node.py header), else this
        # marks obstacles in the wrong spot. Reactive STOP (/g1/human_cmd) is
        # unaffected and works without this.
        # humans:
        #   topic: /human_obstacle_cloud
        #   data_type: "PointCloud2"
        #   max_obstacle_height: 2.0
        #   min_obstacle_height: 0.1
        #   clearing: false
        #   marking: true
        #   obstacle_max_range: 6.0
        #   obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: pelvis
      use_sim_time: false
      robot_radius: 0.30
      resolution: 0.05
      rolling_window: true
      width: 20
      height: 20
      transform_tolerance: 1.0   # absorb ZED-VIO TF jitter (see local_costmap)
      track_unknown_space: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        # DISABLED: the chest-mounted ZED is pitched ~17.6 deg down, so it sees the
        # floor and marks it as an obstacle wall right in front -> RPP "detected
        # collision ahead" -> robot never moves. Human avoidance is handled by the
        # /g1/human_cmd velocity override (detection), not this costmap, so the demo
        # navigates fine without depth obstacles. Re-enable + fix height filtering
        # (min_obstacle_height vs the pitched-camera floor) if wall avoidance is wanted.
        enabled: false
        observation_sources: depth
        depth:
          topic: /zed/zed_node/point_cloud/cloud_registered
          sensor_frame: zed_left_camera_frame
          data_type: "PointCloud2"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.05
          clearing: true
          marking: true
          raytrace_max_range: 5.0
          obstacle_max_range: 4.5
        # ── Predictive human obstacles — DISABLED pending coordinate check ──
        # See local_costmap above and human_obstacle_node.py header. To enable:
        # set `observation_sources: depth humans` and uncomment.
        # humans:
        #   topic: /human_obstacle_cloud
        #   data_type: "PointCloud2"
        #   max_obstacle_height: 2.0
        #   min_obstacle_height: 0.1
        #   clearing: false
        #   marking: true
        #   obstacle_max_range: 6.0
        #   obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"   # Jazzy uses :: not / (Humble)
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# Jazzy: the node is `behavior_server` (was `recoveries_server` in Humble), the
# param key is `behavior_plugins` (was `recovery_plugins`), and the plugin package
# is `nav2_behaviors` (was `nav2_recoveries`).
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Instance names ARE the action-server names the default Jazzy BT calls:
    # it expects `backup` (not Humble's `back_up`), plus drive_on_heading /
    # assisted_teleop. Mismatched names -> bt_navigator fails to activate with
    # "backup action server not available".
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    spin_dist: 1.57
    linear_vel: -0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.0
    use_sim_time: false

# Jazzy's navigation_launch.py adds collision_monitor as a MANAGED node that sits
# in the cmd_vel path (velocity_smoother -> cmd_vel_smoothed -> collision_monitor
# -> cmd_vel). It hard-requires observation_sources, so with no config here it
# failed to configure and aborted Nav2 bringup. Minimal near-passthrough config:
# a small stop circle around the robot, fed by the ZED point cloud with the floor
# height-filtered out, so it activates and forwards cmd_vel without false stops.
collision_monitor:
  ros__parameters:
    base_frame_id: "pelvis"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    # ZED-VIO odom TF lags ~50ms, so requesting the transform at "now" (what
    # base_shift_correction does) hit "extrapolation into the future" -> the
    # source went invalid -> collision_monitor forced a STOP and never forwarded
    # cmd_vel. Use the data at its own stamp (no shift) + generous tolerances.
    transform_tolerance: 1.0
    source_timeout: 5.0
    base_shift_correction: False
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop"]
    PolygonStop:
      type: "circle"
      radius: 0.35
      action_type: "stop"
      min_points: 8
      visualize: True
      polygon_pub_topic: "collision_polygon_stop"
      enabled: True
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "/zed/zed_node/point_cloud/cloud_registered"
      min_height: -0.6     # metres in the pelvis frame; excludes the floor (~-0.8)
      max_height: 0.5
      enabled: True

# Jazzy also adds docking_server (opennav_docking) as a MANAGED node. Unused here,
# but it hard-requires `dock_plugins` or it fails to configure and aborts bringup.
# Minimal plugin declaration so it configures/activates cleanly; no docks defined.
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
    docks: ['none']
    none:
      type: 'simple_charging_dock'
      frame: odom
      pose: [0.0, 0.0, 0.0]

robot_state_publisher:
  ros__parameters:
    use_sim_time: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0
