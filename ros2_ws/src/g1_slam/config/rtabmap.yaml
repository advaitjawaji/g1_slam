# RTAB-Map parameters tuned for RealSense D435i on Unitree G1
# Reference: http://wiki.ros.org/rtabmap_ros/Tutorials/SetupOnYourRobot

rtabmap:
  ros__parameters:

    # Frame IDs — matched to g1_29dof.urdf
    frame_id: pelvis
    odom_frame_id: odom
    map_frame_id: map

    # Subscribe to RGB-D + IMU
    subscribe_depth: true
    subscribe_rgb: true
    subscribe_imu: true

    # Topic remappings handled in launch file

    # Update rate
    Rtabmap/DetectionRate: "1.0"

    # Larger sync queue to handle slow Genesis CPU camera (~1-3 Hz)
    topic_queue_size: 30
    sync_queue_size: 30

    # Loop closure
    Kp/MaxFeatures: "500"
    Vis/MinInliers: "15"
    Vis/InlierDistance: "0.1"

    # Memory
    Mem/IncrementalMemory: "true"
    Mem/InitWMWithAllNodes: "false"

    # Odometry correction — important for legged robots (non-smooth motion)
    Odom/Strategy: "0"            # Frame-to-map
    Odom/ResetCountdown: "1"

    # Depth filtering for RealSense D435i
    Rtabmap/StartNewMapOnLoopClosure: "false"
    Grid/MaxObstacleHeight: "2.0"
    Grid/MinGroundWidth: "0.1"
    Grid/NormalsSegmentation: "true"

    # 3D map
    Grid/3D: "false"              # Use 2D occupancy grid for navigation
    Grid/CellSize: "0.05"
